name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore backend/Gym-Inventory-Management-System.slnx

      - name: Build
        run: dotnet build backend/Gym-Inventory-Management-System.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test backend/Gym-Inventory-Management-System.slnx --no-build --configuration Release --verbosity normal